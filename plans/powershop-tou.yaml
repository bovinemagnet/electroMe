# Powershop time-of-use tariff, AusNet distribution zone.
# Rates as published on the retailer's fact sheet; GST inclusive.
# This file previously claimed to be the household's current AGL tariff. It never was:
# the rates below are Powershop's. The household's own plan is agl-flat-current.yaml.
id: powershop-tou
name: Powershop time of use
retailer: Powershop
zone: AUSNET
gstInclusive: true
charges:
  - type: dailySupply
    cents: 123.20
  - type: timeOfUse
    bands:
      - { from: "00:00", to: "06:00", days: ALL, cents: 4.99 }
      - { from: "06:00", to: "11:00", days: ALL, cents: 24.77 }
      - { from: "11:00", to: "16:00", days: ALL, cents: 24.77 }
      - { from: "16:00", to: "21:00", days: ALL, cents: 49.54 }
      - { from: "21:00", to: "24:00", days: ALL, cents: 24.77 }
