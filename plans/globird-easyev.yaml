# GloBird "EASYEV" Residential (Flexible Rate), AusNet distribution zone.
# Consumer Data Right register, plan GLO741889MR@VEC, retrieved 20 August 2026.
# Rates converted from the register's GST-exclusive dollars: 1.35, 0.59, 0.31 and 0.054545,
# each x 110 to give GST-inclusive cents.
#
# KNOWN TO BE WRONG, and by how much. The register publishes a single 20 kWh daily allowance
# covering BOTH the 00:00-06:00 and the 11:00-14:00 windows. A band in this model owns its own
# allowance, so the two bands below each get 20 kWh and this file therefore under-costs the
# plan on any day the household draws more than 20 kWh across the pair. The market harvester
# refuses this plan outright for the same reason rather than map it this way; this file exists
# so the plan can still be seen and compared, with the error stated.
id: globird-easyev
name: EasyEV
retailer: GloBird
zone: AUSNET
gstInclusive: true
charges:
  - type: dailySupply
    cents: 148.50
  - type: timeOfUse
    bands:
      - { from: "16:00", to: "23:00", days: ALL, cents: 64.90 }
      - { from: "06:00", to: "11:00", days: ALL, cents: 34.10 }
      - { from: "14:00", to: "16:00", days: ALL, cents: 34.10 }
      - { from: "23:00", to: "24:00", days: ALL, cents: 34.10 }
      - from: "00:00"
        to: "06:00"
        days: ALL
        reset: DAILY
        tiers:
          - { upToKWh: 20, cents: 6.00 }
          - { cents: 34.10 }
      - from: "11:00"
        to: "14:00"
        days: ALL
        reset: DAILY
        tiers:
          - { upToKWh: 20, cents: 6.00 }
          - { cents: 34.10 }
