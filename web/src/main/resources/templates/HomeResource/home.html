{#include base}
{#body}

<form id="controls"
      hx-get="/fragments/dashboard"
      hx-target="#dashboard"
      hx-trigger="load, change, submit"
      hx-swap="innerHTML"
      hx-indicator="#busy">
  <label>From
    <input type="date" name="from" value="{shell.window.from}"
           min="{shell.available.from}" max="{shell.available.to}">
  </label>
  <label>To
    <input type="date" name="to" value="{shell.window.to}"
           min="{shell.available.from}" max="{shell.available.to}">
  </label>
  <button type="submit" class="primary">Update</button>
  <span id="busy" class="htmx-indicator">Costing&hellip;</span>
  <span class="spacer"></span>
  <span class="meta" style="font-size:12px; color:var(--muted)">
    Data available {shell.available.from} to {shell.available.to} &middot; {shell.planCount} plans
  </span>
</form>

<main id="dashboard"><p class="loading">Costing {shell.planCount} plans against your usage&hellip;</p></main>

<section id="scenarios" hx-get="/fragments/scenarios" hx-trigger="load" hx-swap="innerHTML"></section>

<section id="market" hx-get="/fragments/market" hx-trigger="load" hx-swap="innerHTML"></section>

<aside id="quality" hx-get="/fragments/quality" hx-trigger="load" hx-swap="innerHTML"></aside>

<footer style="margin-top:8px">
  <button type="button"
          hx-post="/fragments/plans/reload"
          hx-include="#controls"
          hx-target="#dashboard"
          hx-swap="innerHTML">Reload plan files</button>
</footer>

{/body}
{/include}
