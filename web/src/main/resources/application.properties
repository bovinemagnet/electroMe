quarkus.application.name=electroMe
quarkus.http.port=8080

# Where the household interval export lives. Not in the repository: it carries
# an account number and NMI.
electrome.usage.csv=../MyUsageData_19-08-2026.csv

# Plan definitions. Re-read on demand from the UI, not on the classpath.
electrome.plans.dir=../plans

# Default comparison window, used when the page is first opened.
electrome.default-window-days=365

# A typo in a template should fail loudly in development, not render blank.
quarkus.qute.property-not-found-strategy=throw-exception
